<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Usage Meter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="shell" title="">
        <canvas id="gauge" width="200" height="200"></canvas>
        <div id="meta">
          <div id="label" aria-live="polite">
            <span id="cursorPct" class="pct cursor">—</span>
            <span class="sep">·</span>
            <span id="otherPct" class="pct other">—</span>
          </div>
          <div id="legend" hidden>
            <span id="legendCursor" class="leg cursor"></span>
            <span class="sep">·</span>
            <span id="legendOther" class="leg other"></span>
          </div>
          <div id="plan"></div>
        </div>
        <div id="bmlBar">
          <button
            type="button"
            id="bmlBtn"
            title="Open BML panel"
            aria-expanded="false"
            aria-controls="bmlPanel"
            aria-label="Open BML panel"
          >
            BML
          </button>
        </div>
      </div>

      <div id="bmlPanel" hidden>
        <header class="bml-head">
          <strong>BML Process</strong>
          <label class="bml-project-picker">
            <span class="visually-hidden">Project</span>
            <select
              id="bmlProjectSelect"
              title="Choose which project BML runs against"
              aria-label="BML project"
            >
              <option value="">Select a project…</option>
            </select>
          </label>
        </header>

        <section class="bml-section" id="bmlBuildSection">
          <ol
            id="bmlChain"
            class="chain"
            aria-label="Main Matt flow — Start runs these in order"
          ></ol>
          <div class="bml-alts" id="bmlAltsWrap">
            <p class="bml-alts-label">Alternatives (manual)</p>
            <div
              id="bmlAlternates"
              class="bml-alts-row"
              aria-label="Alternate skills — click to run one"
            ></div>
          </div>
          <div class="bml-footer">
            <p id="bmlCost" class="bml-cost">Est. —</p>
            <p id="bmlStatus" class="bml-status" hidden></p>
            <div class="btn-row">
              <button
                type="button"
                id="bmlRun"
                class="btn primary"
                title="Start the main Matt flow (grill → spec → tickets → implement → review)"
                disabled
              >
                Start
              </button>
              <button
                type="button"
                id="bmlConfirm"
                class="btn primary"
                hidden
                title="Mark this skill done after Agent finishes, then copy the next"
              >
                Continue
              </button>
              <button type="button" id="bmlCancel" class="btn danger" hidden>
                Cancel
              </button>
            </div>
          </div>
        </section>

        <section class="bml-section" id="bmlMeasureSection" hidden>
          <div class="row"><strong class="small">Measure</strong></div>
          <input id="mValue" type="text" placeholder="This week value (e.g. 55%)" />
          <textarea id="mText" rows="2" placeholder="Weekly numbers / notes"></textarea>
          <div class="btn-row">
            <button type="button" id="bmlPostMeasure" class="btn primary">
              Post to issue
            </button>
          </div>
          <label class="check">
            <input type="checkbox" id="mDuration" />Duration elapsed
          </label>
          <label class="check">
            <input type="checkbox" id="mKill" />Kill threshold hit
          </label>
          <ul id="mNotes" class="notes muted small"></ul>
        </section>

        <section class="bml-section" id="bmlLearnSection" hidden>
          <div class="row"><strong class="small">Learn (light)</strong></div>
          <div class="btn-row">
            <button type="button" class="btn ghost" data-learn="persevere">
              Persevere
            </button>
            <button type="button" class="btn ghost" data-learn="pivot">
              Pivot
            </button>
            <button type="button" class="btn ghost" data-learn="kill-candidate">
              Kill
            </button>
          </div>
          <textarea
            id="learnEvidence"
            rows="2"
            placeholder="Decision + evidence"
          ></textarea>
        </section>
      </div>
    </div>
    <script src="paint.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
